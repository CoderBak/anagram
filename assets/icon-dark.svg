<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dark icon for 96 and 128 px and the README. Left: the score's scale, one stroke through the
       chips' dark-page colours (lib/render/scale.ts), human at the top. Right: three lines of prose.
       The tile keeps a margin, as the store and the extensions page expect; icon-dark-small.svg
       draws the same picture full-bleed and heavier on the 16 px grid for 16, 32 and 48 px. -->
  <defs>
    <!-- Continuous-curvature corners -->
    <path id="tileShape" d="M307 96H717C848.8 96 928 175.2 928 307V717C928 848.8 848.8 928 717 928H307C175.2 928 96 848.8 96 717V307C96 175.2 175.2 96 307 96Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
    <linearGradient id="tile" x1="0" y1="96" x2="0" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1e23"/>
      <stop offset="1" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="96" x2="0" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- The scale runs from human at the top to AI-generated at the foot; its caps are solid -->
    <linearGradient id="scale" x1="0" y1="316" x2="0" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33d996"/>
      <stop offset="0.333" stop-color="#ffc21a"/>
      <stop offset="0.667" stop-color="#ff8633"/>
      <stop offset="1" stop-color="#ff5470"/>
    </linearGradient>
  </defs>

  <use href="#tileShape" fill="url(#tile)"/>
  <use href="#tileShape" fill="none" stroke="url(#tileEdge)" stroke-width="4" clip-path="url(#tileClip)"/>

  <!-- The scale: a slimmer stroke than the prose, so the text leads -->
  <rect x="256" y="288" width="56" height="448" rx="28" fill="url(#scale)"/>

  <!-- Prose: two near-full lines and a short last one, as a paragraph ends -->
  <g fill="#f4f3ef">
    <rect x="384" y="288" width="384" height="80" rx="40"/>
    <rect x="384" y="472" width="352" height="80" rx="40"/>
    <rect x="384" y="656" width="208" height="80" rx="40"/>
  </g>
</svg>
