<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Light icon for 16, 32 and 48 px: icon-dark-small.svg's geometry on a light tile, with the chips'
       light-page colours (lib/render/scale.ts). Shown on dark toolbars and light-theme pages;
       a hairline edge keeps the tile off a white page. -->
  <defs>
    <path id="tileShape" d="M4 0H12C14.5 0 16 1.5 16 4V12C16 14.5 14.5 16 12 16H4C1.5 16 0 14.5 0 12V4C0 1.5 1.5 0 4 0Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
    <linearGradient id="scale" x1="0" y1="5" x2="0" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00a06a"/>
      <stop offset="0.333" stop-color="#e3a400"/>
      <stop offset="0.667" stop-color="#f0600f"/>
      <stop offset="1" stop-color="#a6002e"/>
    </linearGradient>
  </defs>
  <use href="#tileShape" fill="#f7f7f5"/>
  <use href="#tileShape" fill="none" stroke="#0e121e" stroke-opacity="0.12" stroke-width="0.5" clip-path="url(#tileClip)"/>
  <rect x="3" y="4" width="2" height="8" rx="1" fill="url(#scale)"/>
  <g fill="#2a2c32">
    <rect x="7" y="4" width="6" height="2" rx="1"/>
    <rect x="7" y="7" width="6" height="2" rx="1"/>
    <rect x="7" y="10" width="3" height="2" rx="1"/>
  </g>
</svg>
