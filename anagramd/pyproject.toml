[project]
name = "anagramd"
version = "0.4.0"
description = "Local EditLens scoring daemon for the Anagram browser extension"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "safetensors>=0.4",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "emoji>=2.10",
  "huggingface_hub>=0.25",
  "filelock>=3.13",
  "psutil>=6.0",
  "onnxruntime>=1.30,<1.31; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
  "fasttext>=0.9.3; sys_platform != 'win32'",
  "fasttext-wheel==0.9.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
bench = ["peft>=0.13", "accelerate>=1.0"]

[tool.uv]
# Reproducible installs: `uv sync --frozen` from uv.lock, never a resolve at install time.
package = false
