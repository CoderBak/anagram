[project]
name = "anagramd"
version = "0.8.0"
description = "Local EditLens native component for the Anagram browser extension"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  # Apple Silicon runs the classifier in MLX; Torch serves CUDA and the other platforms.
  # On Linux, Torch comes with the cuda extra, which install.sh adds only for an NVIDIA GPU.
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.4; sys_platform != 'linux' and (sys_platform != 'darwin' or platform_machine != 'arm64')",
  "transformers>=4.45; sys_platform != 'linux' and (sys_platform != 'darwin' or platform_machine != 'arm64')",
  "safetensors>=0.4; sys_platform != 'linux' and (sys_platform != 'darwin' or platform_machine != 'arm64')",
  "tokenizers>=0.21",
  "numpy>=1.26",
  "pydantic>=2.7",
  "emoji>=2.10",
  "huggingface_hub>=1.31,<2",
  "filelock>=3.13",
  "psutil>=6.0",
  "onnxruntime>=1.30,<1.31; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
  "fasttext-predict==0.9.2.4; sys_platform == 'darwin'",
  "fasttext-wheel==0.9.2; sys_platform != 'darwin'",
]

[project.optional-dependencies]
# PyPI's Linux Torch is the CUDA build (about 5 GB with its libraries); ONNX Runtime runs the CPU.
cuda = [
  "torch>=2.4; sys_platform == 'linux'",
  "transformers>=4.45; sys_platform == 'linux'",
  "safetensors>=0.4; sys_platform == 'linux'",
]

[tool.uv]
# Reproducible installs: `uv sync --frozen` from uv.lock, never a resolve at install time.
package = false
