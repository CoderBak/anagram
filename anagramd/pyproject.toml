[project]
name = "anagramd"
version = "0.7.0"
description = "Local EditLens native component for the Anagram browser extension"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pydantic>=2.7",
  "emoji>=2.10",
  "huggingface_hub>=1.31,<2",
  "filelock>=3.13",
  "psutil>=6.0",
  "onnxruntime>=1.30,<1.31; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
  "fasttext-predict==0.9.2.4; sys_platform == 'darwin'",
  "fasttext-wheel==0.9.2; sys_platform != 'darwin'",
]

[tool.uv]
# Reproducible installs: `uv sync --frozen` from uv.lock, never a resolve at install time.
package = false
