[project]
name = "anagramd"
version = "0.3.1"
description = "Local EditLens scoring daemon for the Anagram browser extension"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "safetensors>=0.4",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "emoji>=2.10",
  "huggingface_hub>=0.25",
  "fasttext>=0.9.3",
]

[project.optional-dependencies]
bench = ["peft>=0.13", "accelerate>=1.0", "psutil>=6.0"]

[tool.uv]
# Reproducible installs: `uv sync --frozen` from uv.lock, never a resolve at install time.
package = false
