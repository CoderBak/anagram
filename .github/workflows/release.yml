# Release: build the extension and the local engine bundle for a tag, sign them, and attach
# them to its GitHub Release. First-run commands name the exact matching version's assets.
name: release
# Manual only, and from the tag: Actions, release, Run workflow, with "Use workflow from" set
# to the version tag (v0.9.0). Pushing a tag or creating a GitHub release does not start it.
# This workflow is a release's only signer: install.sh and install.ps1 accept a release fetched
# over HTTPS only with a Sigstore bundle whose certificate names this file at the release's
# tag (installer/verify_release.py). A release built anywhere else is not one they install.
on:
  workflow_dispatch:

jobs:
  # Nothing is published that the whole matrix has not passed: the same suites as every push,
  # on Linux, Windows and macOS, and the Firefox build in a real Firefox.
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref_name }}

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The run's OIDC token is what Sigstore issues the signing certificate to.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:node
      - run: node scripts/release.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The installers' own verifier, pinned by hash (installer/sigstore.txt), signs every asset
      # and then checks the archives as they will: with Sigstore's trust root as it is now, and
      # with the one it carries, which is all a computer that cannot reach Sigstore has.
      - name: Sign the assets (Sigstore keyless)
        run: |
          python -m venv "$RUNNER_TEMP/sigstore"
          "$RUNNER_TEMP/sigstore/bin/python" -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r installer/sigstore.txt
          ( cd dist && "$RUNNER_TEMP/sigstore/bin/python" -m sigstore sign anagram.tar.gz anagram.zip install.sh install.ps1 anagram-chrome-*.zip anagram-firefox-*.zip )
          "$RUNNER_TEMP/sigstore/bin/python" - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          sys.path.insert(0, "installer")
          import verify_release as release
          version = sys.argv[1]
          for archive in ("dist/anagram.tar.gz", "dist/anagram.zip"):
              bundle = open(archive + ".sigstore.json", "rb").read()
              assert release.signed_version(bundle, asked=version) == version, archive
              for offline in (False, True):
                  release.verify(archive, bundle, release.SIGNER + version, offline=offline)
          PY
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.sigstore.json
            dist/anagram.tar.gz
            dist/anagram.tar.gz.sha256
            dist/anagram.zip
            dist/anagram.zip.sha256
            dist/install.sh
            dist/install.sh.sha256
            dist/install.ps1
            dist/install.ps1.sha256
            dist/anagram-chrome-*.zip
            dist/anagram-chrome-*.zip.sha256
            dist/anagram-firefox-*.zip
            dist/anagram-firefox-*.zip.sha256
