# Release: on a version tag, build the extension and the daemon bundle and attach them to a
# GitHub Release. First-run commands name the exact matching version's installer assets.
# Modelkit downloads use a pinned public revision without any Hugging Face credential.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  # Nothing is published that the whole matrix has not passed: the same suites as every push,
  # on Linux, Windows and macOS, and the Firefox build in a real Firefox.
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:node
      - run: node scripts/release.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/anagram.tar.gz
            dist/anagram.tar.gz.sha256
            dist/anagram.zip
            dist/anagram.zip.sha256
            dist/install.sh
            dist/install.sh.sha256
            dist/install.ps1
            dist/install.ps1.sha256
            dist/anagram-chrome-*.zip
            dist/anagram-chrome-*.zip.sha256
            dist/anagram-firefox-*.zip
            dist/anagram-firefox-*.zip.sha256
