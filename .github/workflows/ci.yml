# CI for the Anagram extension.
#
# Every push runs the deterministic suites on Linux AND Windows (fonts, scrollbars and
# text metrics differ per platform — the device matrix in test/matrix.mjs runs on both).
# macOS runners cost 10x the minutes on a private repository, so that leg runs on tags and
# on demand (Actions → ci → Run workflow); day to day macOS is covered locally, headless.
# Live-site scenarios and the perf benchmark stay local — they depend on network and
# machine speed. Screenshots of every matrix profile are kept as build artifacts.
#
# A release calls this workflow as its gate (`workflow_call`, see release.yml), which is why a
# pushed tag does not start it a second time: `push` is held to branches, and the tag's run —
# macOS leg included — is the one the release waits for.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS joins on tags and manual runs only (see the note at the top).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # 45 rather than 30 since the four standalone checks and the daemon's own suite joined
    # the job: each of the four launches its own browser, and the Windows leg is the slow one.
    timeout-minutes: 45
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:node
      - name: first-run runtime selection (shipping build, no host grants)
        run: node test/runtime.mjs
      - run: npm run test:unit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: native and daemon test dependencies (no model runtimes)
        run: python -m pip install 'numpy>=1.26' 'pydantic>=2' 'fastapi>=0.115' httpx emoji filelock psutil
      - name: isolated native registration safety (no real browser registration)
        run: python test/native_registration.py
      - name: native browser setup (EN/ZH, isolated profiles, real stdio)
        if: runner.os != 'Windows'
        run: node test/native-browser.mjs
      - name: Windows native launcher and PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-native.ps1
      - name: Windows fastText wheel and pinned language model smoke
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: fasttext-wheel==0.9.2
          python test/windows_fasttext.py
      - name: installer safety (offline cases)
        if: runner.os != 'Windows'
        run: npm run test:installer
      - run: npm run test:e2e
      - name: scenarios (local fixtures)
        run: node test/scenarios.mjs --local
      # axe-core on the four extension pages and on our injected UI, plus the keyboard,
      # focus, target-size and contrast checks axe cannot make. Runs on every OS leg:
      # hit targets and focus rings are measured in CSS pixels from real layout, and
      # platform font metrics move them.
      - name: accessibility (axe-core + keyboard / contrast)
        run: npm run test:a11y
      - name: device matrix
        run: npm run test:matrix
      # The checks that stand on their own: each answers one question a suite full of other
      # things would bury, and a release is exactly when you want them answered. They need
      # what the suites need and nothing more — the test build, the fake daemon, no network
      # and no model.
      - name: diagnostics report ("Copy page diagnostics")
        run: node test/diagnostics-check.mjs
      # Not on Windows: one case of this builds a local PDF's address as "file://" + a
      # temporary path, which is an address on POSIX and is not one on Windows, where
      # C:\…\x.pdf has to be spelt file:///C:/…/x.pdf. Everything else in the check is
      # platform-independent, so the gate goes away the day that line does.
      - name: where a PDF opens
        if: runner.os != 'Windows'
        run: node test/pdf-route-check.mjs
      # --chrome-only: the Firefox half of the same check runs in the firefox job below,
      # which is the only job with a Firefox in it.
      - name: content-security-policy, live
        run: node test/csp-check.mjs --chrome-only
      - name: the two WebAssembly PDF decoders
        run: node test/pdf-codecs-check.mjs
      # What anagramd promises about itself: offline serving, loopback guards,
      # scoring provenance, first-run comparison and explicit saved selection.
      #
      # Not on Windows: test/daemon.sh is a POSIX shell script that runs `python3`, and the
      # Windows image has neither by that name. What it would check there is the same on
      # every platform; Windows native framing and language inference have dedicated checks above.
      - name: daemon properties (no model)
        if: runner.os != 'Windows'
        run: npm run test:daemon
      - name: e2e again with a real window (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env HEADED=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/ci
          if-no-files-found: ignore
          retention-days: 7

  # The Firefox MV2 build, in a real Firefox. Playwright cannot load an extension into
  # Firefox, so this suite drives it through puppeteer-core over WebDriver BiDi (no
  # geckodriver) — see test/firefox-harness.mjs. Linux only: the runner image already
  # ships a Firefox, and the suite is about the engine, not the platform's text metrics.
  firefox:
    name: firefox (ubuntu-latest)
    runs-on: ubuntu-latest
    # 30 rather than 20 since the policy check (both browsers) joined this job.
    timeout-minutes: 30
    needs: test
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Which Firefox. The extension's manifest says 128+, but the suite needs more than
      # that: BiDi only learned webExtension.install in 135, and everything the extension
      # renders needs 140 (a content script cannot adopt a constructed stylesheet into a
      # shadow root before Gecko 140). So: use the runner image's own Firefox when it is
      # 140 or newer, otherwise fetch a Mozilla build into ~/.cache/puppeteer, which is
      # where test/firefox-harness.mjs looks next. Both versions are printed either way.
      - name: resolve Firefox (>= 140, printed)
        run: |
          set -e
          MAJOR=0
          if command -v firefox >/dev/null 2>&1; then
            echo "runner image: $(firefox --version)"
            MAJOR=$(firefox --version | grep -oE '[0-9]+' | head -1)
          else
            echo "runner image: no firefox on PATH"
          fi
          if [ "$MAJOR" -lt 140 ]; then
            echo "runner Firefox is $MAJOR (< 140) — fetching a Mozilla build"
            npx --yes @puppeteer/browsers install firefox@stable --path "$HOME/.cache/puppeteer"
            "$HOME"/.cache/puppeteer/firefox/*/firefox/firefox --version 2>/dev/null || true
          fi
      # The policy check drives BOTH browsers in one run and has no Firefox-only mode, so
      # this job needs a Chromium as well. The Chrome half is a few minutes' duplication of
      # what the test job already did; the Firefox half is the part that exists nowhere
      # else, and it reports SKIP rather than FAIL if the Firefox above could not be
      # installed — so the job still fails only on a policy that is really wrong.
      - name: install Chromium (the policy check runs both browsers)
        run: npx playwright install --with-deps chromium
      - run: npm run build:firefox
      # xvfb is NOT used: the suite is headless by construction and has no HEADED mode.
      - run: npm run test:firefox
      - name: content-security-policy, live (both browsers)
        run: node test/csp-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-firefox
          path: test-results/firefox
          if-no-files-found: ignore
          retention-days: 7
