# CI for the Anagram extension.
#
# Every push runs the deterministic suites on Linux AND Windows (fonts, scrollbars and
# text metrics differ per platform — the device matrix in test/matrix.mjs runs on both).
# macOS runners cost 10x the minutes on a private repository, so that leg runs on tags and
# on demand (Actions → ci → Run workflow); day to day macOS is covered locally, headless.
# Live-site scenarios and the perf benchmark stay local — they depend on network and
# machine speed. Screenshots of every matrix profile are kept as build artifacts.
#
# A release calls this workflow as its gate (`workflow_call`, see release.yml), which is why a
# pushed tag does not start it a second time: `push` is held to branches, and the tag's run —
# macOS leg included — is the one the release waits for.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS joins on tags and manual runs only (see the note at the top).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:unit
      - name: installer safety (offline cases)
        if: runner.os != 'Windows'
        run: npm run test:installer
      - run: npm run test:e2e
      - name: scenarios (local fixtures)
        run: node test/scenarios.mjs --local
      # axe-core on the four extension pages and on our injected UI, plus the keyboard,
      # focus, target-size and contrast checks axe cannot make. Runs on every OS leg:
      # hit targets and focus rings are measured in CSS pixels from real layout, and
      # platform font metrics move them.
      - name: accessibility (axe-core + keyboard / contrast)
        run: npm run test:a11y
      - name: device matrix
        run: npm run test:matrix
      - name: e2e again with a real window (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env HEADED=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/ci
          if-no-files-found: ignore
          retention-days: 7

  # The Firefox MV2 build, in a real Firefox. Playwright cannot load an extension into
  # Firefox, so this suite drives it through puppeteer-core over WebDriver BiDi (no
  # geckodriver) — see test/firefox-harness.mjs. Linux only: the runner image already
  # ships a Firefox, and the suite is about the engine, not the platform's text metrics.
  firefox:
    name: firefox (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Which Firefox. The extension's manifest says 128+, but the suite needs more than
      # that: BiDi only learned webExtension.install in 135, and everything the extension
      # renders needs 140 (a content script cannot adopt a constructed stylesheet into a
      # shadow root before Gecko 140). So: use the runner image's own Firefox when it is
      # 140 or newer, otherwise fetch a Mozilla build into ~/.cache/puppeteer, which is
      # where test/firefox-harness.mjs looks next. Both versions are printed either way.
      - name: resolve Firefox (>= 140, printed)
        run: |
          set -e
          MAJOR=0
          if command -v firefox >/dev/null 2>&1; then
            echo "runner image: $(firefox --version)"
            MAJOR=$(firefox --version | grep -oE '[0-9]+' | head -1)
          else
            echo "runner image: no firefox on PATH"
          fi
          if [ "$MAJOR" -lt 140 ]; then
            echo "runner Firefox is $MAJOR (< 140) — fetching a Mozilla build"
            npx --yes @puppeteer/browsers install firefox@stable --path "$HOME/.cache/puppeteer"
            "$HOME"/.cache/puppeteer/firefox/*/firefox/firefox --version 2>/dev/null || true
          fi
      - run: npm run build:firefox
      # xvfb is NOT used: the suite is headless by construction and has no HEADED mode.
      - run: npm run test:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-firefox
          path: test-results/firefox
          if-no-files-found: ignore
          retention-days: 7
