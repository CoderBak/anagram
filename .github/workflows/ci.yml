# CI for the Anagram extension. Activates as soon as this repo gets a GitHub remote.
# Live-site scenarios (test/scenarios.mjs) and the perf benchmark stay local-only —
# they depend on network and machine speed.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:unit
      - name: e2e (fixture-only, headed under xvfb)
        run: xvfb-run -a npm run test:e2e
