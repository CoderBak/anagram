name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:node
      - name: first-run runtime selection (shipping build, no host grants)
        run: node test/runtime.mjs
      - run: npm run test:unit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: native component test dependencies (no model runtimes)
        run: python -m pip install 'numpy>=1.26' 'pydantic>=2' emoji filelock psutil
      - name: isolated native registration safety (no real browser registration)
        run: python test/native_registration.py
      - name: native browser setup (EN/ZH, isolated profiles, real stdio)
        if: runner.os != 'Windows'
        run: node test/native-browser.mjs
      - name: Windows native launcher and PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-native.ps1
      - name: Windows fastText wheel and pinned language model smoke
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: fasttext-wheel==0.9.2
          python test/windows_fasttext.py
      - name: installer safety (offline cases)
        if: runner.os != 'Windows'
        run: npm run test:installer
      - run: npm run test:e2e
      - name: scenarios (local fixtures)
        run: node test/scenarios.mjs --local
      - name: accessibility (axe-core + keyboard / contrast)
        run: npm run test:a11y
      - name: device matrix
        run: npm run test:matrix
      - name: diagnostics report ("Copy page diagnostics")
        run: node test/diagnostics-check.mjs
      - name: where a PDF opens
        if: runner.os != 'Windows'
        run: node test/pdf-route-check.mjs
      - name: content-security-policy, live
        run: node test/csp-check.mjs --chrome-only
      - name: the two WebAssembly PDF decoders
        run: node test/pdf-codecs-check.mjs
      - name: native engine and lifecycle (no model)
        if: runner.os != 'Windows'
        run: npm run test:backend
      - name: e2e again with a real window (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env HEADED=1 npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/ci
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: firefox (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    env:
      ANAGRAM_ARTIFACTS: ${{ github.workspace }}/test-results/firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: resolve Firefox (>= 140, printed)
        run: |
          set -e
          MAJOR=0
          if command -v firefox >/dev/null 2>&1; then
            echo "runner image: $(firefox --version)"
            MAJOR=$(firefox --version | grep -oE '[0-9]+' | head -1)
          else
            echo "runner image: no firefox on PATH"
          fi
          if [ "$MAJOR" -lt 140 ]; then
            echo "runner Firefox is $MAJOR (< 140) — fetching a Mozilla build"
            npx --yes @puppeteer/browsers install firefox@stable --path "$HOME/.cache/puppeteer"
            "$HOME"/.cache/puppeteer/firefox/*/firefox/firefox --version 2>/dev/null || true
          fi
      - name: install Chromium (the policy check runs both browsers)
        run: npx playwright install --with-deps chromium
      - run: npm run build:firefox
      - run: npm run test:firefox
      - name: content-security-policy, live (both browsers)
        run: node test/csp-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-firefox
          path: test-results/firefox
          if-no-files-found: ignore
          retention-days: 7
