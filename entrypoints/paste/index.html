<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pasteTitle">Analyze text</title>
    <link rel="stylesheet" href="/pages/theme.css" />
    <link rel="stylesheet" href="/pages/paste.css" />
  </head>
  <body>
    <main class="page">
      <header class="hdr">
        <img class="logo-light" src="/icons/icon-light-96.png" alt="" />
        <img class="logo-dark" src="/icons/icon-96.png" alt="" />
        <div>
          <h1 id="editorTitle" data-i18n="pasteTitle">Analyze text</h1>
        </div>
        <button id="settings" class="btn icon-action" data-variant="ghost" data-size="icon" type="button" title="Settings" aria-label="Settings"
          data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings">
          <svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#settings"></use></svg>
        </button>
      </header>

      <div class="stack">
        <section class="editor">
          <textarea class="textarea" id="text" aria-describedby="words" spellcheck="false" autocomplete="off" autocorrect="off" translate="no" aria-label="English text to analyze" data-i18n-aria-label="pasteInput" placeholder="Paste English text…" data-i18n-placeholder="pastePlaceholder"></textarea>
          <div class="actions">
            <button class="btn" id="analyze" type="button" disabled data-i18n="pasteAnalyze">Analyze</button>
            <button class="btn" data-variant="outline" id="edit" type="button" aria-controls="text" hidden><svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#edit"></use></svg><span data-i18n="pasteEdit">Edit text</span></button>
            <button class="btn" data-variant="ghost" id="pick" type="button" title="Open file…" data-i18n-title="pasteFile"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#folder"></use></svg><span data-i18n="pasteFile">Open file…</span></button>
            <input id="file" type="file" accept=".txt,text/plain" hidden />
            <div class="editor-meta">
              <span class="count" id="words" aria-live="off"></span>
              <button hidden class="btn" data-variant="ghost" id="clear" type="button" data-i18n="pasteClear">Clear</button>
            </div>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section id="results" aria-labelledby="summary" hidden>
          <header class="result-heading">
            <div class="verdict"><h2 id="summary" tabindex="-1"></h2><span class="chip" id="score" aria-describedby="estimate"></span></div>
            <button id="scoreToggle" class="disclosure-action" type="button" aria-controls="scoreDetails" aria-expanded="false"><span data-i18n="scoreBreakdown">Score breakdown</span></button>
          </header>
          <p class="muted" id="coverage"></p>
          <div id="scoreDetails" hidden>
            <div class="mix" id="mix" aria-hidden="true"></div>
            <ul class="legend" id="legend" aria-describedby="estimate"></ul>
            <p class="muted" id="estimate"></p>
          </div>
          <h3 id="readingTitle" class="reading-title" data-i18n="pasteByParagraph">By paragraph</h3>
          <div id="reading" translate="no"></div>
          <div class="export">
            <label><input class="input" id="includeText" type="checkbox" /> <span data-i18n="pasteExportText">Include original text in report</span></label>
            <span id="copyStatus" class="muted" role="status"></span>
            <button class="btn icon-action" data-variant="ghost" id="copy" type="button" title="Copy report" aria-label="Copy report" data-i18n-title="panelCopyReport" data-i18n-aria-label="panelCopyReport"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#copy"></use></svg></button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
