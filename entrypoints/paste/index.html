<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pasteTitle">Analyze text</title>
    <style>
      /* Layout only; colours, type and controls come from Basecoat (Vega). */
      body { margin: 0; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 1.55; }
      .page { max-width: 760px; margin: 0 auto; padding: 24px 20px 32px; }
      header.hdr { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
      header.hdr img { width: 48px; height: 48px; margin: -2px; }
      header.hdr .logo-dark { display: none; }
      html.dark header.hdr .logo-light { display: none; }
      html.dark header.hdr .logo-dark { display: block; }
      header.hdr > div { flex: 1; min-width: 0; }
      header.hdr #settings { align-self: flex-start; }
      header.hdr h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
      header.hdr p { margin: 3px 0 0; color: var(--muted-foreground); }
      .stack { display: flex; flex-direction: column; gap: 12px; }
      .card > section { display: flex; flex-direction: column; gap: 10px; }
      .field-label { font-size: 13px; font-weight: 500; }
      /* Grows with the text up to half the window, then scrolls: a long text must not push the
         verdict off the bottom of the page. */
      textarea { width: 100%; box-sizing: border-box; min-height: 220px; max-height: 50vh; overflow-y: auto; resize: vertical; padding: 10px 12px; font: inherit; line-height: 1.55; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .actions .count { margin-inline-start: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
      #status { margin: 0; font-size: 13px; }
      #status:empty { display: none; }
      .muted { margin: 0; font-size: 12.5px; color: var(--muted-foreground); }
      /* The verdict: its word in its colour, the score, and how the four words shared it. */
      .verdict { display: flex; align-items: center; gap: 10px; }
      .verdict h2 { margin: 0; font-size: 18px; font-weight: 600; }
      .verdict .chip { font-size: 15px; padding: 3px 8px; }
      .verdict .chip:empty { display: none; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); }
      /* A verdict's chip as the page shows it (lib/render/badge.css.ts): the word's colour, the
         number in the ink that reads on it; human's a tint with an edge. */
      .chip { display: inline-block; padding: 2px 6px; border: 1px solid var(--c); border-radius: 5px; background: var(--c); color: #141414; font-size: 11px; font-weight: 600; line-height: 1.35; font-variant-numeric: tabular-nums; }
      .chip.b3 { color: #ffffff; }
      html.dark .chip.b3 { color: #141414; }
      .chip.b0 { background: color-mix(in oklab, var(--c) 22%, var(--card)); border-color: color-mix(in oklab, var(--c) 70%, var(--card)); color: var(--foreground); }
      .mix { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--muted); }
      .mix > span { background: var(--c); }
      .mix > span + span { border-inline-start: 1.5px solid var(--card); }
      .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
      .legend li { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .legend .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .legend .n { font-variant-numeric: tabular-nums; font-weight: 600; }
      .export { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .export label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
      /* Each pass the model read, edged in its word's colour. */
      #windows { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
      #windows li { padding: 8px 12px; border: 1px solid var(--border); border-inline-start: 3px solid var(--c); border-radius: 8px; }
      #windows .head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }

      #windows p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 560px) { .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hdr">
        <img class="logo-light" src="/icons/icon-light-96.png" alt="" />
        <img class="logo-dark" src="/icons/icon-96.png" alt="" />
        <div>
          <h1 data-i18n="pasteTitle">Analyze text</h1>
          <p id="intro" data-i18n="pasteIntro">Paste English text or open a text file to analyze it on this computer.</p>
        </div>
        <button id="settings" class="btn" data-variant="ghost" data-size="icon" type="button" title="Settings" aria-label="Settings"
          data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <div class="stack">
        <section class="card" data-size="sm">
          <section>
            <label class="field-label" for="text" data-i18n="pasteInput">Text to analyze</label>
            <textarea class="textarea" id="text" maxlength="200000" spellcheck="false"></textarea>
            <div class="actions">
              <button class="btn" id="analyze" type="button" data-i18n="pasteAnalyze">Analyze</button>
              <button class="btn" data-variant="outline" id="pick" type="button" data-i18n="pasteFile">Open text file…</button>
              <input id="file" type="file" accept=".txt,text/plain" hidden />
              <button class="btn" data-variant="ghost" id="clear" type="button" data-i18n="pasteClear">Clear text and results</button>
              <span class="count" id="words" aria-live="off"></span>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
          </section>
        </section>

        <section class="card" data-size="sm" id="results" aria-labelledby="summary" hidden>
          <section>
            <div class="verdict" id="verdict"><span class="chip" id="score"></span><h2 id="summary"></h2></div>
            <div class="mix" id="mix" aria-hidden="true"></div>
            <ul class="legend" id="legend"></ul>
            <p class="muted" id="coverage"></p>
            <p class="muted" id="estimate" data-i18n="reportEstimate">The score is (p1 + 2p2 + 3p3) / 3 for the four EditLens classes. It summarizes the class distribution; it is not the fraction of AI-written words, a measured edit distance, or proof of authorship.</p>
            <ol id="windows"></ol>
            <div class="export">
              <button class="btn" data-variant="outline" data-size="sm" id="copy" type="button" data-i18n="panelCopyReport">Copy report</button>
              <label><input class="input" id="includeText" type="checkbox" /> <span data-i18n="pasteExportText">Include original text in report</span></label>
            </div>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
