<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <!-- Engine controls are restricted to our top-level pages: keep Settings out of an
         embedded chrome://extensions iframe. -->
    <meta name="manifest.open_in_tab" content="true" />
    <title data-i18n="optionsTitle">Anagram settings</title>
    <style>
      /* Layout only; colours, type and controls come from Basecoat (Vega). */
      body { margin: 0; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 1.5; }
      .page { max-width: 720px; margin: 0 auto; padding: 24px 20px 32px; }
      header.hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      header.hdr img { width: 44px; height: 44px; margin: -2px; }
      header.hdr .logo-dark { display: none; }
      html.dark header.hdr .logo-light { display: none; }
      html.dark header.hdr .logo-dark { display: block; }
      header.hdr h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
      header.hdr .ver { margin-inline-start: auto; font-size: 12px; color: var(--muted-foreground); }
      /* One list: a short label on the left, its controls on the right. */
      .groups { display: flex; flex-direction: column; }
      .group { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 16px; padding: 8px 0; border-top: 1px solid var(--border); }
      .groups > .group:first-child { border-top: 0; padding-top: 0; }
      .group > .group-label { padding-top: 10px; font-size: 13.5px; font-weight: 600; }
      .group-body { min-width: 0; }
      .group-body.rows > .row:first-child { padding-top: 6px; }
      .row > .row-body { justify-content: flex-end; }
      .field-count { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
      .form-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0 2px; }
      .form-row .input { flex: 1 1 200px; }
      .form-row .select { width: 150px; }
      .form-error { margin: 6px 0 0; font-size: 12.5px; color: var(--destructive); flex: 1 0 100%; }
      .form-note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted-foreground); flex: 1 0 100%; }
      .empty { margin: 0; padding: 2px 0; color: var(--muted-foreground); font-size: 13px; }
      .mode-on { color: oklch(0.55 0.15 150); font-weight: 500; }
      html.dark .mode-on { color: oklch(0.76 0.15 150); }
      .mode-off { color: var(--muted-foreground); }
      .links { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 16px; font-size: 12.5px; line-height: 1.6; color: var(--muted-foreground); }
      .links a { display: inline-block; min-height: 24px; line-height: 24px; color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; }
      .links span { line-height: 24px; }
      /* Out of the page, still in the accessibility tree. */
      .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @media (max-width: 520px) {
        .group { grid-template-columns: minmax(0, 1fr); }
        .group > .group-label { padding-top: 6px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hdr">
        <img class="logo-light" src="/icons/icon-light-96.png" alt="" />
        <img class="logo-dark" src="/icons/icon-96.png" alt="" />
        <h1 data-i18n="optionsTitle">Anagram settings</h1>
        <span class="ver" id="version"></span>
      </header>

      <section class="card" data-size="sm">
        <section class="groups">
          <div class="group" id="engineGroup">
            <span class="group-label" id="engineLabel" data-i18n="optEngine">Engine</span>
            <div class="group-body" role="group" aria-labelledby="engineLabel"><div id="componentSettings"></div></div>
          </div>

          <div class="group">
            <span class="group-label" id="sitesLabel" data-i18n="optSites">Sites</span>
            <div class="group-body rows" id="siteRows" role="group" aria-labelledby="sitesLabel">
              <div class="row" id="comments" hidden>
                <p id="commentsState" role="status" aria-live="polite"></p>
                <span class="row-body">
                  <button type="button" class="btn" data-variant="outline" data-size="sm" id="commentsAllow" aria-describedby="commentsState"></button>
                </span>
              </div>
              <div class="row">
                <label for="enabled" data-i18n="optEnabled">Run on granted sites by default</label>
                <span class="row-body"><input id="enabled" class="input" type="checkbox" role="switch" /></span>
              </div>
              <div id="sites"></div>
              <form class="form-row" id="addRule">
                <input id="addHost" class="input" type="text" placeholder="example.com" aria-label="Site"
                  data-i18n-aria-label="optColSite" autocomplete="off" spellcheck="false" />
                <select id="addMode" class="select" aria-label="Rule" data-i18n-aria-label="optColRule">
                  <option value="on" data-i18n="optAlwaysOn">Always on</option>
                  <option value="off" data-i18n="optAlwaysOff">Always off</option>
                </select>
                <button type="submit" class="btn" data-size="sm" data-i18n="optAdd">Add</button>
                <p class="form-error" id="addError" hidden></p>
                <p class="form-note" id="addNote" hidden></p>
              </form>
            </div>
          </div>

          <div class="group">
            <span class="group-label" id="pdfsLabel" data-i18n="optPdfs">PDFs</span>
            <div class="group-body rows" id="pdfRows" role="group" aria-labelledby="pdfsLabel"></div>
          </div>

          <div class="group">
            <span class="group-label" id="marksLabel" data-i18n="optMarks">Marks</span>
            <div class="group-body rows" role="group" aria-labelledby="marksLabel">
              <div class="row">
                <label for="displayMode" data-i18n="optChips">Chips</label>
                <span class="row-body">
                  <select id="displayMode" class="select">
                    <option value="all" data-i18n="optEveryParagraph">Every paragraph</option>
                    <option value="flagged" data-i18n="popupFlaggedOnly">Flagged only</option>
                  </select>
                </span>
              </div>
              <div class="row">
                <label for="underline" data-i18n="optUnderline">Underlines</label>
                <span class="row-body">
                  <select id="underline" class="select">
                    <option value="all" data-i18n="optEveryParagraph">Every paragraph</option>
                    <option value="off" data-i18n="optUnderlineOff">Off</option>
                  </select>
                </span>
              </div>
            </div>
          </div>

          <div class="group">
            <span class="group-label" id="lengthLabel" data-i18n="optLength">Length</span>
            <div class="group-body rows" role="group" aria-labelledby="lengthLabel">
              <div class="row">
                <label for="minWords" data-i18n="optMinWords">Minimum words</label>
                <span class="row-body"><select id="minWords" class="select" aria-describedby="minWordsNote"></select></span>
                <p id="minWordsNote" class="row-note" data-i18n="optMinWordsHint">Under 75 words is less reliable.</p>
              </div>
              <div class="row">
                <label for="mergeShorts" data-i18n="optMerge">Group short paragraphs</label>
                <span class="row-body"><input id="mergeShorts" class="input" type="checkbox" role="switch" /></span>
              </div>
            </div>
          </div>

          <div class="group">
            <span class="group-label" id="cacheLabel" data-i18n="optCache">Cache</span>
            <div class="group-body rows" role="group" aria-labelledby="cacheLabel">
              <div class="row">
                <select id="cacheMode" class="select" aria-label="Verdict cache" data-i18n-aria-label="optCacheMode">
                  <option value="persistent" data-i18n="optCachePersistent">Keep 30 days</option>
                  <option value="session" data-i18n="optCacheSession">Memory only</option>
                </select>
                <span class="row-body">
                  <span id="cacheCount" class="field-count"></span>
                  <button type="button" class="btn" data-variant="outline" data-size="sm" id="clearCache" data-i18n="optClearCache">Clear</button>
                </span>
                <p id="cacheStatus" class="row-note" role="status"></p>
              </div>
            </div>
          </div>
        </section>
      </section>

      <footer class="links">
        <a class="link" href="https://github.com/CoderBak/anagram/blob/dev/PRIVACY.md" target="_blank" rel="noopener noreferrer" data-i18n="optPrivacyPolicy">Privacy policy</a>
        <span data-i18n="modelLine">Model: pangram/editlens_roberta-large (CC BY-NC-SA 4.0, non-commercial).</span>
        <a id="sourceCode" target="_blank" rel="noopener noreferrer" data-i18n="sourceCodeLink">Source code (AGPL-3.0)</a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
