<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <title data-i18n="popupTitle">Anagram</title>
    <link rel="stylesheet" href="/pages/theme.css" />
    <link rel="stylesheet" href="/pages/popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img class="logo-light" src="/icons/icon-light-96.png" alt="" />
      <img class="logo-dark" src="/icons/icon-96.png" alt="" />
      <h1>Anagram</h1>
      <button id="gear" class="btn icon-action" data-variant="ghost" data-size="icon" type="button" title="Settings" aria-label="Settings"
        data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings">
        <svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#settings"></use></svg>
      </button>
    </header>

    <main>
      <section class="grp act">
        <div class="status" id="status">…</div>
        <section class="report" id="pageReport" aria-labelledby="reportTitle" hidden>
          <header class="report-heading" hidden><h2 id="reportTitle" tabindex="-1"></h2></header>
          <div class="report-body"></div>
        </section>
        <p class="keepopen" id="keepOpen" hidden data-i18n="engineKeepOpen">Keep this browser open until the download finishes.</p>
        <div class="page-actions">
        <button id="pageAction" class="btn" data-size="sm" type="button" hidden></button>
        <!-- Label, variant and action are the page's state (./state.ts); until the page
             has answered there is nothing honest to put on it. -->
        <button id="action" class="btn" data-variant="outline" data-size="sm" type="button" disabled></button>
        <button id="localFileSettings" class="btn" data-variant="ghost" data-size="sm" type="button" hidden data-i18n="popupFileAccessSettings">Local file settings</button>
        <!-- The local engine kept crashing: the in-browser engine, beside Retry (./main.ts). -->
        <button id="switchEngine" class="btn" data-variant="outline" data-size="sm" type="button" hidden data-i18n="engineSwitchToInBrowser">Use in-browser engine</button>
        </div>
      </section>

      <section class="grp" id="siteGroup" hidden>
        <div class="field" data-orientation="horizontal">
          <label for="siteEnabled" data-i18n="popupThisSite">Scan this site automatically</label>
          <input id="siteEnabled" type="checkbox" role="switch" data-size="sm" aria-describedby="siteRuleNote" />
        </div>
        <p id="siteRuleNote" hidden></p>
      </section>

      <footer class="foot">
        <div class="tools">
          <button id="openReader" class="btn" data-variant="ghost" data-size="sm" type="button">
            <svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#folder"></use></svg><span data-i18n="popupOpenReader">Open a PDF…</span>
          </button>
          <button id="analyzeText" class="btn" data-variant="ghost" data-size="sm" type="button">
            <svg class="action-icon" aria-hidden="true" focusable="false"><use href="/icons/actions.svg#text"></use></svg><span data-i18n="pasteTitle">Analyze text</span>
          </button>
        </div>
        <!-- Today's reading, while statistics are recorded (lib/stats/). -->
        <p class="stats-today" id="statsToday" hidden><span id="statsTodayText"></span><button type="button" id="openStats" data-i18n="popupStatsLink">Statistics</button></p>
        <p class="engine" id="backend" data-i18n="popupEngineOutdated" hidden>Local engine needs an update</p>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
