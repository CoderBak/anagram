<!doctype html>
<!--
  Bilibili comments: nested OPEN shadow roots, no article-like element anywhere. Synthetic text.

  Measured logged-out on bilibili.com/video/… (2026-09-19): `bili-comments` → (shadow)
  `div#contents > div#feed > bili-comment-thread-renderer` → (shadow) `bili-comment-renderer#comment`
  + `div#replies > bili-comment-replies-renderer` → (shadow) `div#expander > div#expander-contents
  > bili-comment-reply-renderer`; inside a comment `div#body > a#user-avatar (bili-avatar) +
  div#main > div#header (bili-comment-user-info) + div#content (bili-rich-text) + div#footer
  (bili-comment-action-buttons-renderer: div#pubdate, like, reply)`; the text is
  `bili-rich-text` → (shadow) `p#contents`, display inline, white-space pre-line, so the
  block that owns the text is `div#content`. Avatar, name and date each sit in a shadow root
  of their own, where a structural survey of the document cannot see them: this is what the
  two tag names in lib/dom/scope.ts are for. Written as declarative shadow DOM.

    alice  a short, a full, a short and a full paragraph (blank lines in one pre-line <p>) →
           ONE unit ×4 (it was two: ×3, ×1)
      bob, carol  short replies under alice → nothing; never added up, never a part of alice's
    dan    a short paragraph, a search-keyword LINK on a line of its own, a short paragraph — as
           measured on the pinned comment of that page. The lone link is link-dense: a barrier,
           which on the bare page ended the group twice and left all 87 words unjudged. Inside
           a post it is left out and ends nothing → one unit ×2, without the link.

  Annotation: see x-timeline.html (test/unit.mjs looks into open shadow roots for it).
-->

    </template></bili-comment-thread-renderer>

    <bili-comment-thread-renderer><template shadowrootmode="open"><style>:host { display: block; margin: 12px 0; }</style>
      <bili-comment-renderer id="comment"><template shadowrootmode="open"><style>:host { display: block; }</style>
        <div id="body"><a id="user-avatar" target="_blank" href="//space.example.invalid/1"><bili-avatar></bili-avatar></a>
          <div id="main"><div id="header"><bili-comment-user-info><template shadowrootmode="open"><div id="info" data-chrome><div id="user-name"><a target="_blank" href="//space.example.invalid/1">dan</a></div><div id="user-level"><img alt="" width="30" height="30"></div></div></template></bili-comment-user-info></div>
            <div id="content" data-voice="dan" data-expect="unit" data-parts="2"><bili-rich-text><template shadowrootmode="open"><style>:host { display: inline; } p { display: inline; white-space: pre-line; margin: 0; }</style><p id="contents" ><span>My first manager measured the long way round although the rules said otherwise. The reading group
            rewrote every broken hinge and nobody noticed for a month and way. The landlord kept the winter schedule for most of that spring.

</span><a target="_blank" data-type="search" href="//search.example.invalid/all?keyword=x">harbour ferry timetable</a><span>

The ferry crew borrowed a map of the valley before anyone else arrived. My neighbour found the same

            <div id="footer"><bili-comment-action-buttons-renderer><template shadowrootmode="open"><div id="pubdate" data-chrome>2026-09-01 10:24</div><div id="like"><button><span id="count">128</span></button></div><div id="reply"><button>回复</button></div></template></bili-comment-action-buttons-renderer></div></div></div>
